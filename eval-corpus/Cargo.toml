# Its own workspace root, deliberately: `spytial` must not depend on the corpus
# in any way, not even as a dev-dependency, so that building or packaging the
# crate never needs this directory. The arrow points one way only — the corpus
# depends on `spytial`, and its tests run from here.
[workspace]

[package]
name = "spytial-eval-corpus"
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
description = "Shared value corpus for the cross-language Spytial reify evaluation. Not published."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
spytial = { path = ".." }
# A normal dependency, not a dev-dependency: the generator lives in `src/pbt.rs`
# so `../../reify-eval/rust.ipynb` can draw from the same strategies the CI
# suite does. Nothing in `spytial` sees this — the dependency arrow points from
# the corpus to the crate, never back.
proptest = "1"

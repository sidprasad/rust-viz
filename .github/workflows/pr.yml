name: PR Checks

on:
  pull_request:

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The spec-tables generator formats its output, so the drift check
          # below needs rustfmt; this action installs a minimal profile.
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build all targets
        run: cargo build --all-targets

      # `--workspace` covers the derive macro crate as well as `spytial`. It only
      # does so because the root manifest now declares both as members; a path
      # dependency alone is not a member, and these runs used to skip it.
      - name: Run unit and integration tests
        run: cargo test --workspace --lib --tests

      # Guards the derive's own doc example, which never compiled and never ran.
      - name: Run doc tests
        run: cargo test --workspace --doc

      # eval-corpus is its own workspace, so the runs above do not reach it.
      # It has its own job below rather than a step here: the property search
      # wants a wider run than a three-OS matrix should pay for, and a failure
      # in it means something different from a build failure.

      # Also its own workspace. Fails if macros/src/spec_tables.rs has drifted
      # from templates/vendor/spytial-language.json — i.e. spytial-core was
      # re-vendored without regenerating the derive macro's spec tables.
      # rustfmt is needed because the generator formats its output.
      - name: Check spec tables are current
        run: cargo test --manifest-path spec-codegen/Cargo.toml

  reify-oracles:
    name: Reify oracles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      # The suite pins 1024 cases in source so a local `cargo test` stays
      # quick. CI is where the search has room to run, and a wider search is
      # the reason this job exists separately from the build matrix.
      PROPTEST_CASES: 8192
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The crate's own round-trip tests, organised by Rust shape. This is
      # where specific regressions are pinned, so it is worth naming even
      # though `cargo test --workspace --tests` above also runs it.
      - name: Run the crate's reify tests
        run: cargo test --test reify

      # The corpus: the 29-category coverage table, the serde representation
      # attributes, and the randomized property search over all of them.
      # Single-threaded and uncaptured so the coverage tables land in the log
      # in order, which is what makes a failure here readable.
      - name: Run the reify corpus and property search
        run: >
          cargo test --manifest-path eval-corpus/Cargo.toml
          -- --nocapture --test-threads=1

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Its own workspace, so the check above does not reach it.
      - name: Check eval-corpus formatting
        run: cargo fmt --manifest-path eval-corpus/Cargo.toml --all -- --check

      # Likewise. (macros/src/spec_tables.rs is generated, but the generator
      # runs its output through rustfmt, so it is checked like any other file.)
      - name: Check spec-codegen formatting
        run: cargo fmt --manifest-path spec-codegen/Cargo.toml --all -- --check
